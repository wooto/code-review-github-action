name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: wooto/shared-workflows/.github/workflows/workflow-lint.yml@30bff244694ce77b0e0d7e857b3a1ef4dd59d4cb
