name: Workflow Lint

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'

permissions:
  contents: read

jobs:
  workflow-lint:
    uses: wooto/shared-workflows/.github/workflows/workflow-lint.yml@a737062b0f408baecdacb3e2e88aa174e17aa2db
