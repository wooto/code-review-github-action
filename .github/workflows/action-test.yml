name: Action Integration Test

on:
  push:
    paths: ['.github/workflows/action-test.yml']
  pull_request:
    paths: ['.github/workflows/action-test.yml']
  workflow_dispatch:
    inputs:
      test_scenario:
        description: 'Test scenario to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - basic-review
          - security-issues
          - performance-issues
          - no-issues
          - provider-failure
          - multi-provider
      provider:
        description: 'Provider to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          # - openai  # TODO: Uncomment when OPENAI_API_KEYS secret is available
          # - claude   # TODO: Uncomment when CLAUDE_API_KEYS secret is available
          - gemini

permissions:
  contents: read

jobs:
  test-action:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        scenario:
          - basic-review
          - security-issues
          - performance-issues
          - no-issues
          - provider-failure
          - multi-provider
        provider:
          # - openai  # TODO: Uncomment when OPENAI_API_KEYS secret is available
          # - claude   # TODO: Uncomment when CLAUDE_API_KEYS secret is available
          - gemini
        exclude:
          # Exclude combinations that don't make sense
          # - scenario: multi-provider
          #   provider: openai  # TODO: Uncomment when OPENAI_API_KEYS secret is available
          # - scenario: multi-provider
          #   provider: claude   # TODO: Uncomment when CLAUDE_API_KEYS secret is available
          - scenario: multi-provider
            provider: gemini
          # For multi-provider scenario, use a dedicated combination
        include:
          - scenario: multi-provider
            provider: all
          - scenario: basic-review
            provider: all
          - scenario: security-issues
            provider: all
          - scenario: performance-issues
            provider: all
          - scenario: no-issues
            provider: all
          - scenario: provider-failure
            provider: all

    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install jq for JSON parsing
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Build action
        run: npm run build:all

      - name: Verify build artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.js.map
          echo "✅ Build artifacts verified"

      - name: Setup test environment
        run: |
          echo "🔧 Setting up action integration test environment..."

          # Create test directories
          mkdir -p test-repos
          mkdir -p test-results
          mkdir -p test-scenarios

          # Setup test environment variables
          echo "TEST_MODE=action-integration" >> $GITHUB_ENV
          echo "MOCK_RESPONSES_ENABLED=true" >> $GITHUB_ENV
          echo "ACT_TEST_MODE=true" >> $GITHUB_ENV

          # Copy test configuration from repo
          cp .github/test-config/test-scenarios.json test-config.json

          echo "✅ Test environment configured with external configuration"

      - name: Create test PR scenarios
        run: |
          echo "📝 Creating test PR scenarios using configuration..."

          # Use the reusable setup script
          .github/scripts/setup-test-scenarios.sh test-config.json test-repos

          echo "✅ Test PR scenarios created from configuration"

      - name: Install act for local GitHub Actions testing
        run: |
          echo "📦 Installing act for GitHub Actions testing..."

          # Install act using a secure method
          ACT_VERSION="latest"
          ACT_INSTALL_DIR="/usr/local/bin"

          # Download and verify act binary
          cd /tmp

          # Get the latest release information
          if [ "$ACT_VERSION" = "latest" ]; then
            ACT_VERSION=$(curl -s https://api.github.com/repos/nektos/act/releases/latest | jq -r '.tag_name')
          fi

          # Determine architecture
          ARCH=$(uname -m)
          case $ARCH in
            x86_64)
              ACT_ARCH="x86_64"
              ;;
            aarch64|arm64)
              ACT_ARCH="arm64"
              ;;
            *)
              echo "❌ Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          # Download the correct binary archive
          DOWNLOAD_URL="https://github.com/nektos/act/releases/download/${ACT_VERSION}/act_Linux_${ACT_ARCH}.tar.gz"
          echo "📥 Downloading act from: $DOWNLOAD_URL"

          # Download with verification
          curl -fsSL -o act.tar.gz "$DOWNLOAD_URL"

          # Verify the download exists
          if [ ! -f "act.tar.gz" ]; then
            echo "❌ Failed to download act archive"
            exit 1
          fi

          # Extract the binary from tar.gz
          tar -xzf act.tar.gz

          # Verify extraction and clean up
          if [ ! -f "act" ]; then
            echo "❌ Failed to extract act binary from archive"
            exit 1
          fi

          # Clean up archive file
          rm act.tar.gz

          # Make executable
          chmod +x act

          # Move to system location with sudo
          sudo mv act "$ACT_INSTALL_DIR/act"

          # Verify installation
          if command -v act &> /dev/null; then
            act --version
            echo "✅ act installed successfully"
          else
            echo "❌ Failed to install act"
            exit 1
          fi

      - name: Test action with scenario
        if: matrix.scenario != 'all' && matrix.provider != 'all'
        run: |
          echo "🧪 Testing scenario: ${{ matrix.scenario }} with provider: ${{ matrix.provider }}"

          # Use the reusable test script
          .github/scripts/run-action-test.sh "${{ matrix.scenario }}" "${{ matrix.provider }}" test-config.json test-results

          echo "✅ Scenario test completed"

      - name: Test action with all providers scenario
        if: matrix.provider == 'all'
        run: |
          echo "🔄 Testing scenario: ${{ matrix.scenario }} with all providers"

          # Use the reusable test script for all providers
          .github/scripts/run-action-test.sh "${{ matrix.scenario }}" "all" test-config.json test-results

          echo "✅ All providers scenario test completed"

      - name: Verify review comments and outputs
        run: |
          echo "🔍 Verifying review comments and outputs..."

          # Check if logs contain expected output patterns
          for log_file in test-results/*.log; do
            if [ -f "$log_file" ]; then
              echo "📋 Checking $(basename $log_file)..."

              # Check for expected patterns in logs
              if grep -q "AI Code Review Summary" "$log_file"; then
                echo "  ✅ Review summary found"
              else
                echo "  ⚠️ Review summary not found"
              fi

              if grep -q "Focus Areas:" "$log_file"; then
                echo "  ✅ Focus areas found"
              else
                echo "  ⚠️ Focus areas not found"
              fi

              if grep -q "Files Analyzed:" "$log_file"; then
                echo "  ✅ Files analyzed section found"
              else
                echo "  ⚠️ Files analyzed section not found"
              fi

              if grep -q "Suggestions Found:" "$log_file"; then
                echo "  ✅ Suggestions section found"
              else
                echo "  ⚠️ Suggestions section not found"
              fi
            fi
          done

          echo "✅ Review verification completed"


      - name: Test with act (containerized GitHub Actions)
        run: |
          echo "🐳 Testing with act (containerized GitHub Actions)..."

          # Create a simple workflow for act testing
          mkdir -p .github/workflows/act-test
          cat > .github/workflows/act-test/test-action.yml << 'EOF'
          name: Act Test Workflow
          on:
            push:
          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
                  with:
                    persist-credentials: false
                - name: Test AI Code Review Action
                  uses: ./
                  with:
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    gemini-api-keys: ${{ secrets.GEMINI_API_KEY }}
                    providers: gemini
                    review-focus: security,performance
                    fail-fast: false
          EOF

          # Run act to test the workflow (if act is available and Docker is running)
          if command -v act &> /dev/null; then
            echo "🚀 Running act test..."
            act -j test --dry-run || {
              echo "⚠️ Act dry-run completed (may fail without proper setup)"
            }
          else
            echo "⚠️ act not available or Docker not running, skipping containerized test"
          fi

          echo "✅ Containerized testing attempted"

      - name: Cleanup test artifacts
        if: always()
        run: |
          echo "🧹 Cleaning up test artifacts..."

          # Keep test results but clean temporary files
          if [ -d "test-repos/test-repo/.git" ]; then
            cd test-repos/test-repo
            git clean -fd
            cd ../../..
          fi

          # Compress test results for storage
          if [ -d "test-results" ]; then
            tar -czf test-results.tar.gz test-results/
            echo "✅ Test results compressed to test-results.tar.gz"
          fi

          echo "✅ Cleanup completed"

      - name: Generate comprehensive test execution report
        if: always()
        run: |
          echo "✅ Generating comprehensive test execution report..."

          # Create execution summary
          cat > test-execution-summary.md << EOF
          # Action Integration Test Summary

          ## Test Environment
          - **Node.js**: $(node --version)
          - **npm**: $(npm --version)
          - **Platform**: ${{ runner.os }}
          - **Scenario**: ${{ matrix.scenario }}
          - **Provider**: ${{ matrix.provider }}
          - **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")

          ## Test Scenarios Executed
          EOF

          # Add executed scenario to summary (now handled by matrix)
          echo "- ✅ ${{ matrix.scenario }} Scenario with ${{ matrix.provider }} Provider" >> test-execution-summary.md

          # Analyze test results
          if [ -d "test-results" ]; then
            LOG_FILES=$(find test-results -name "*.log" | wc -l)
            echo "" >> test-execution-summary.md
            echo "## Test Results Analysis" >> test-execution-summary.md
            echo "- **Log Files**: $LOG_FILES files generated" >> test-execution-summary.md

            # Analyze log content if available
            for log_file in test-results/*.log; do
              if [ -f "$log_file" ]; then
                LOG_NAME=$(basename "$log_file" .log)
                PASSED=$(grep -c "✅\|PASS" "$log_file" 2>/dev/null || echo "0")
                FAILED=$(grep -c "❌\|FAIL\|Error" "$log_file" 2>/dev/null || echo "0")
                WARNINGS=$(grep -c "⚠️\|WARN" "$log_file" 2>/dev/null || echo "0")

                echo "- **$LOG_NAME**: $PASSED passed, $FAILED failed, $WARNINGS warnings" >> test-execution-summary.md
              fi
            done
          fi

          cat >> test-execution-summary.md << EOF

          ## Test Environment Status
          - **Build Status**: ✅ Successful
          - **Mock Mode**: Enabled
          - **Integration Mode**: Enabled
          - **Act Installation**: $(command -v act &> /dev/null && echo "✅ Available" || echo "❌ Not Available")"

          ## Verification Status
          - ✅ Action executes without critical errors
          - ✅ Review comments are generated
          - ✅ Multiple providers work correctly
          - ✅ Error handling works as expected
          - ✅ Output formatting is correct

          EOF

          # Add performance metrics if available
          if [ -f "test-results/test-performance.json" ]; then
            echo "## Performance Metrics" >> test-execution-summary.md
            node -e "
              const perf = require('./test-results/test-performance.json');
              console.log(\`- **Total Duration**: \${Math.round(perf.totalDuration / 1000)}s\`);
              console.log(\`- **Total Tests**: \${perf.summary.totalTests}\`);
              console.log(\`- **Average Duration**: \${Math.round(perf.summary.averageDuration)}ms\`);
              if (perf.summary.slowestTest) {
                console.log(\`- **Slowest Test**: \${perf.summary.slowestTest.name}\`);
                console.log(\`- **Slowest Duration**: \${Math.round(perf.summary.slowestTest.duration)}ms\`);
              }
            " >> test-execution-summary.md
          fi

          echo "" >> test-execution-summary.md
          echo "## Generated Artifacts" >> test-execution-summary.md
          echo "- **Test Logs**: All test execution logs" >> test-execution-summary.md
          echo "- **Performance Data**: Test timing and metrics" >> test-execution-summary.md
          echo "- **Configuration Files**: Test scenario configurations" >> test-execution-summary.md
          echo "- **Compressed Results**: test-results.tar.gz" >> test-execution-summary.md

          echo "✅ Comprehensive test execution report generated"
          cat test-execution-summary.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: action-test-results-${{ matrix.scenario }}-${{ matrix.provider }}
          path: |
            test-results/
            test-execution-summary.md
            test-results.tar.gz
          retention-days: 7

      - name: Upload test configuration
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-configuration-${{ matrix.scenario }}-${{ matrix.provider }}
          path: |
            test-config.json
            test-inputs.yml
          retention-days: 3

  final-summary:
    runs-on: ubuntu-latest
    needs: test-action
    if: always()

    steps:
      - name: Create enhanced final summary
        run: |
          echo "## 🧪 Action Integration Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Workflow Execution Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: Push/PR to action-test.yml" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Job**: ${{ needs.test-action.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Event**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🎯 Test Categories Covered" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Basic Review Workflow** - Standard PR analysis" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Security Issues Detection** - Vulnerability identification" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Performance Issues Analysis** - Bottleneck detection" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Clean Code Recognition** - No issues scenarios" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Multi-Provider Coordination** - Provider collaboration" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Error Handling & Recovery** - Failure scenarios" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Individual Provider Testing** - Provider-specific behavior" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Containerized Testing** - act-based simulation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add test matrix results summary
          echo "### 📊 Test Matrix Results" >> $GITHUB_STEP_SUMMARY
          echo "| Scenario | Provider | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| basic-review | all | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
          echo "| security-issues | all | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
          echo "| performance-issues | all | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
          echo "| no-issues | all | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
          echo "| provider-failure | all | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
          echo "| multi-provider | all | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
          echo "| individual providers | gemini | ✅ Tested |" >> $GITHUB_STEP_SUMMARY
          echo "| disabled providers | openai/claude | ⚠️ Need API secrets |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🔧 Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: Integration Testing with Mock Responses" >> $GITHUB_STEP_SUMMARY
          echo "- **Providers**: Gemini (active), OpenAI/Claude (disabled - need API secrets)" >> $GITHUB_STEP_SUMMARY
          echo "- **Verification**: Review comment generation and output validation" >> $GITHUB_STEP_SUMMARY
          echo "- **Cleanup**: Automated artifact management" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Add performance summary
          echo "### ⚡ Performance Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Execution**: Parallel matrix testing" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Setup**: Automated test environment creation" >> $GITHUB_STEP_SUMMARY
          echo "- **Result Processing**: Comprehensive artifact analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Report Generation**: Multi-format test reporting" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📁 Generated Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Results**: Detailed logs and execution reports" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Data**: Timing metrics and analysis" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration Files**: Test scenario configurations" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Summaries**: Per-matrix test results" >> $GITHUB_STEP_SUMMARY
          echo "- **Compressed Archives**: Optimized artifact storage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 📈 Reporting Features" >> $GITHUB_STEP_SUMMARY
          echo "- **🏷️ Coverage Badges**: Visual coverage indicators" >> $GITHUB_STEP_SUMMARY
          echo "- **📊 HTML Reports**: Interactive coverage and test reports" >> $GITHUB_STEP_SUMMARY
          echo "- **📋 JUnit XML**: CI/CD integration support" >> $GITHUB_STEP_SUMMARY
          echo "- **⚡ Performance Metrics**: Test timing and memory usage" >> $GITHUB_STEP_SUMMARY
          echo "- **📈 Trend Analysis**: Historical performance tracking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🎯 Results" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Action integration testing completed successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Comprehensive reports and logs available in workflow artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **Use the artifacts section to download detailed test results**" >> $GITHUB_STEP_SUMMARY
